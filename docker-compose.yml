version: "3.7"

services:
  app:
    image: calibrain/shelfmark:latest@sha256:d17c9197c36a43f773418bc2582845c48b788a1e8c9c0d1656ef5a610f4ba85c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - FLASK_PORT=8084
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/books

  proxy:
    image: getumbrel/app-proxy:v1.0.0
    restart: on-failure
    ports:
      - "8084:80"
    depends_on:
      - app
    environment:
      - APP_HOST=app
      - APP_PORT=8084
